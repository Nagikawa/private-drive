@for (action of actions(); track action.id) {
<button
	class="btn btn-ghost btn-sm btn-square"
	type="button"
	[attr.aria-label]="action.label"
	[disabled]="action.disabled"
	(click)="choose(action.id)"
>
	<svg
		xmlns="http://www.w3.org/2000/svg"
		fill="none"
		viewBox="0 0 24 24"
		stroke-width="1.5"
		stroke="currentColor"
		class="h-4 w-4"
		aria-hidden="true"
	>
		<path stroke-linecap="round" stroke-linejoin="round" [attr.d]="action.svg" />
	</svg>
</button>
}
