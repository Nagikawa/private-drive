<ul class="menu menu-xs bg-base-200 rounded-box min-h-full w-full" aria-label="Folders">
	<li>
		<a
			[routerLink]="['/files']"
			[queryParams]="{ folder: null }"
			[class.menu-active]="folder() === ''"
			[class.bg-base-300]="dropTarget() === ''"
			(dragover)="dragOver($event, '')"
			(dragleave)="dragLeave($event, '')"
			(drop)="drop($event, '')"
		>
			<ng-container [ngTemplateOutlet]="folderIcon" />
			Root
		</a>
		@if (nodes().length > 0) {
		<ul>
			<ng-container
				[ngTemplateOutlet]="folderBranch"
				[ngTemplateOutletContext]="{ $implicit: nodes() }"
			/>
		</ul>
		}
	</li>
</ul>
<ng-template #folderIcon>
	<svg
		xmlns="http://www.w3.org/2000/svg"
		fill="none"
		viewBox="0 0 24 24"
		stroke-width="1.5"
		stroke="currentColor"
		class="h-4 w-4"
	>
		<path
			stroke-linecap="round"
			stroke-linejoin="round"
			d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"
		/>
	</svg>
</ng-template>
<ng-template #folderBranch let-nodes>
	@for (node of nodes; track node.path) {
	<li>
		@if (node.children.length === 0) {
		<a
			[routerLink]="['/files']"
			[queryParams]="{ folder: node.path }"
			[class.menu-active]="folder() === node.path"
			[class.bg-base-300]="dropTarget() === node.path"
			(dragover)="dragOver($event, node.path)"
			(dragleave)="dragLeave($event, node.path)"
			(drop)="drop($event, node.path)"
		>
			<ng-container [ngTemplateOutlet]="folderIcon" />
			{{ node.name }}
		</a>
		} @else {
		<details [open]="expanded(node.path)">
			<summary
				[class.menu-active]="folder() === node.path"
				[class.bg-base-300]="dropTarget() === node.path"
				(click)="choose($event, node.path)"
				(dragover)="dragOver($event, node.path)"
				(dragleave)="dragLeave($event, node.path)"
				(drop)="drop($event, node.path)"
			>
				<ng-container [ngTemplateOutlet]="folderIcon" />
				{{ node.name }}
			</summary>
			<ul>
				<ng-container
					[ngTemplateOutlet]="folderBranch"
					[ngTemplateOutletContext]="{ $implicit: node.children }"
				/>
			</ul>
		</details>
		}
	</li>
	}
</ng-template>
