<dialog class="modal" #dialog (close)="onClose()">
  <div class="modal-box">
    <h3 class="text-lg font-bold">{{ title() }}</h3>
    <form novalidate (submit)="onSubmit($event)">
      <fieldset class="fieldset">
        <label class="label" for="folder-name">Name</label>
        <input id="folder-name" class="input w-full" [formField]="nameForm.name" />
        @if (nameForm.name().touched() && nameForm.name().invalid()) {
          <p class="label text-error">{{ nameForm.name().errors()[0].message }}</p>
        }
      </fieldset>
      <div class="modal-action">
        <button class="btn" type="button" (click)="cancel()">Cancel</button>
        <button class="btn" type="submit">{{ action() }}</button>
      </div>
    </form>
  </div>
</dialog>
