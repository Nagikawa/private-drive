<dialog class="modal" #dialog>
	@if (entry(); as entry) {
	<div class="modal-box w-11/12 max-w-5xl">
		<h3 class="text-lg font-bold">{{ entry.name }}</h3>
		<p class="py-4 text-sm">{{ entry.contentType }} · {{ sizeLabel(entry) }}</p>
		<img class="max-h-[70vh] w-full object-contain" [src]="contentUrl(entry)" [alt]="entry.name" />
		<div class="modal-action">
			<form method="dialog">
				<button class="btn" type="submit">Close</button>
			</form>
		</div>
	</div>
	}
</dialog>
